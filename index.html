
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DROFIX RACING V2</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{
 padding:10px;font-size:23px;font-weight:900;
 color:#00e5ff;letter-spacing:2px;
}
#hud{
 display:flex;justify-content:space-around;
 padding:8px;background:#172238;font-size:13px;
}
#hud b{color:#ffdf54}
#wrap{
 position:relative;width:min(100vw,400px);
 margin:auto;overflow:hidden;
}
canvas{
 display:block;width:100%;height:auto;
 background:#292d36;
}
#overlay{
 position:absolute;inset:0;
 background:#080e20ed;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 padding:15px;gap:10px;
}
#overlay h1{color:#00e5ff;margin:5px}
#overlay p{font-size:14px;line-height:1.5}
button{
 border:0;border-radius:12px;padding:13px 19px;
 background:#00d9ff;color:#07101d;
 font-weight:900;font-size:16px;
 touch-action:none;cursor:pointer;
}
button:disabled{opacity:.35}
#garage{
 display:flex;gap:7px;flex-wrap:wrap;
 justify-content:center;max-width:350px;
}
.carBtn{font-size:12px;padding:10px}
#controls{
 display:flex;justify-content:center;gap:10px;
 padding:12px;
}
#controls button{min-width:65px}
#nitro{background:#ffbd30}
#pause{background:#aaa}
#message{color:#ffdc57;font-size:13px}
</style>
</head>
<body>
<header>🏎️ DROFIX RACING V2</header>
<div id="hud">
 <span>Score <b id="score">0</b></span>
 <span>🪙 <b id="coins">0</b></span>
 <span>Level <b id="level">1</b></span>
 <span><b id="speed">0</b> KM/H</span>
</div>

<div id="wrap">
 <canvas id="game" width="360" height="600"></canvas>
 <div id="overlay">
  <h1 id="heading">DROFIX RACING</h1>
  <p id="info">Collect coins, avoid traffic and race!</p>
  <div id="garage"></div>
  <div id="message"></div>
  <button id="play">START RACE ▶</button>
  <p id="best"></p>
 </div>
</div>

<div id="controls">
 <button id="left">◀</button>
 <button id="nitro">⚡ NITRO</button>
 <button id="right">▶</button>
 <button id="pause">Ⅱ</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

const W=360,H=600;
const roadL=36,roadR=324;
const lanes=[84,180,276];

const cars=[
 {name:"BLUE",color:"#00dfff",price:0},
 {name:"RED",color:"#ff435d",price:20},
 {name:"GOLD",color:"#ffd12c",price:50},
 {name:"GREEN",color:"#4aff80",price:100}
];

let bank=Number(localStorage.getItem("droCoins"))||0;
let best=Number(localStorage.getItem("droBest"))||0;
let selected=0;

let state="menu";
let score=0,level=1,speed=0,nitro=100;
let x=180,objects=[],spawn=0,roadOffset=0;
let input={left:false,right:false,nitro:false};
let last=0,audio=null;

function save(){
 localStorage.setItem("droCoins",bank);
 localStorage.setItem("droBest",best);
}

function sound(freq=440,duration=.08,type="sine"){
 try{
  audio=audio||new (window.AudioContext||
    window.webkitAudioContext)();
  let o=audio.createOscillator();
  let g=audio.createGain();
  o.type=type;
  o.frequency.value=freq;
  g.gain.setValueAtTime(.07,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(
    .001,audio.currentTime+duration);
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}

function garage(){
 $("garage").innerHTML="";
 cars.forEach((c,i)=>{
  let b=document.createElement("button");
  b.className="carBtn";
  let unlocked=i===0||
   localStorage.getItem("droCar"+i)==="yes";
  b.textContent=c.name+
   (unlocked?(selected===i?" ✓":""):" 🪙"+c.price);
  b.style.background=c.color;
  b.onclick=()=>{
   if(unlocked){
    selected=i;sound(600);garage();
    $("message").textContent=c.name+" selected!";
   }else if(bank>=c.price){
    bank-=c.price;
    localStorage.setItem("droCar"+i,"yes");
    selected=i;save();garage();hud();
    sound(800);
    $("message").textContent="CAR UNLOCKED!";
   }else{
    $("message").textContent="Not enough coins!";
    sound(180,.2);
   }
  };
  $("garage").appendChild(b);
 });
}

function hud(){
 $("score").textContent=Math.floor(score);
 $("coins").textContent=bank;
 $("level").textContent=level;
 $("speed").textContent=Math.floor(speed);
}

function menu(title,info,button){
 state="menu";
 $("overlay").style.display="flex";
 $("heading").textContent=title;
 $("info").textContent=info;
 $("play").textContent=button;
 $("best").textContent="🏆 BEST SCORE: "+best;
 $("message").textContent="";
 garage();hud();
}

function startGame(){
 score=0;level=1;speed=90;nitro=100;
 x=180;objects=[];spawn=0;roadOffset=0;
 input={left:false,right:false,nitro:false};
 last=0;state="playing";
 $("overlay").style.display="none";
 $("pause").textContent="Ⅱ";
 sound(650,.15);
 requestAnimationFrame(loop);
}

function endGame(){
 state="over";
 sound(130,.4,"sawtooth");
 best=Math.max(best,Math.floor(score));
 save();
 menu("💥 GAME OVER",
 "Your Score: "+Math.floor(score)+
 " | Coins: "+bank,"RACE AGAIN ▶");
 state="over";
}

function car(cx,y,color,enemy=false){
 ctx.save();
 ctx.translate(cx,y);
 ctx.fillStyle="#101010";
 ctx.fillRect(-25,-25,7,20);
 ctx.fillRect(18,-25,7,20);
 ctx.fillRect(-25,12,7,20);
 ctx.fillRect(18,12,7,20);

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(-21,-36,42,72,9);
 ctx.fill();

 ctx.fillStyle="#15253d";
 ctx.fillRect(-15,-18,30,17);
 ctx.fillRect(-15,12,30,12);

 ctx.fillStyle=enemy?"#ffec8a":"#fff";
 ctx.fillRect(-17,enemy?29:-33,9,5);
 ctx.fillRect(8,enemy?29:-33,9,5);

 ctx.fillStyle="#ffffff55";
 ctx.fillRect(-3,-32,6,63);
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#18723b";
 ctx.fillRect(0,0,W,H);

 // Highway
 ctx.fillStyle="#292e3b";
 ctx.fillRect(roadL,0,roadR-roadL,H);

 // Road edges
 ctx.fillStyle="#eee";
 ctx.fillRect(roadL+4,0,4,H);
 ctx.fillRect(roadR-8,0,4,H);

 // Moving lane markings
 ctx.fillStyle="#ffffffaa";
 for(let y=-100+roadOffset;y<H;y+=100){
  ctx.fillRect(130,y,5,48);
  ctx.fillRect(226,y,5,48);
 }

 // Roadside decorations
 for(let y=-60+roadOffset;y<H;y+=100){
  ctx.fillStyle="#f8da42";
  ctx.fillRect(13,y,10,28);
  ctx.fillRect(337,y,10,28);
 }

 // Objects
 objects.forEach(o=>{
  if(o.type==="coin"){
   ctx.fillStyle="#ffcf25";
   ctx.beginPath();
   ctx.arc(o.x,o.y,13,0,Math.PI*2);
   ctx.fill();
   ctx.strokeStyle="#fff4a0";
   ctx.lineWidth=3;ctx.stroke();
   ctx.fillStyle="#8c5900";
   ctx.font="bold 17px Arial";
   ctx.textAlign="center";
   ctx.fillText("$",o.x,o.y+6);
  }else{
   car(o.x,o.y,o.color,true);
  }
 });

 car(x,505,cars[selected].color);

 // Nitro meter
 ctx.fillStyle="#111b";
 ctx.fillRect(12,12,112,23);
 ctx.fillStyle="#ffbd30";
 ctx.fillRect(17,17,nitro,13);
 ctx.fillStyle="white";
 ctx.font="bold 10px Arial";
 ctx.textAlign="left";
 ctx.fillText("NITRO",45,27);

 if(state==="paused"){
  ctx.fillStyle="#0009";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";
  ctx.font="bold 34px Arial";
  ctx.textAlign="center";
  ctx.fillText("PAUSED",180,290);
 }
}

function addObject(){
 let lane=lanes[Math.floor(Math.random()*3)];
 let coin=Math.random()<.35;
 objects.push({
  x:lane,y:-45,
  type:coin?"coin":"enemy",
  color:["#ff4256","#a970ff","#ffab35"]
   [Math.floor(Math.random()*3)]
 });
}

function loop(t){
 if(state!=="playing")return;
 if(!last)last=t;
 let dt=Math.min((t-last)/1000,.04);
 last=t;

 level=1+Math.floor(score/100);
 let boosting=input.nitro&&nitro>0;
 speed=90+Math.min(level*12,110)+(boosting?100:0);

 if(boosting)nitro=Math.max(0,nitro-35*dt);
 else nitro=Math.min(100,nitro+9*dt);

 let movement=260*dt;
 if(input.left)x-=movement;
 if(input.right)x+=movement;
 x=Math.max(roadL+26,Math.min(roadR-26,x));

 let velocity=(210+level*15+(boosting?160:0))*dt;
 roadOffset=(roadOffset+velocity)%100;
 score+=dt*(boosting?16:10);

 spawn+=dt;
 if(spawn>Math.max(.55,1.25-level*.035)){
  spawn=0;addObject();
 }

 for(let i=objects.length-1;i>=0;i--){
  let o=objects[i];
  o.y+=velocity;
  let dx=Math.abs(o.x-x);
  let dy=Math.abs(o.y-505);

  if(o.type==="coin"&&dx<30&&dy<42){
   bank++;save();sound(950,.09);
   objects.splice(i,1);
  }else if(o.type==="enemy"&&dx<39&&dy<65){
   endGame();draw();return;
  }else if(o.y>650){
   objects.splice(i,1);
  }
 }

 hud();draw();
 requestAnimationFrame(loop);
}

$("play").onclick=startGame;

$("pause").onclick=()=>{
 if(state==="playing"){
  state="paused";
  input={left:false,right:false,nitro:false};
  $("pause").textContent="▶";
  draw();
 }else if(state==="paused"){
  state="playing";last=0;
  $("pause").textContent="Ⅱ";
  requestAnimationFrame(loop);
 }
};

function control(id,key){
 let b=$(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  input[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 const stop=()=>input[key]=false;
 b.addEventListener("pointerup",stop);
 b.addEventListener("pointercancel",stop);
 b.addEventListener("lostpointercapture",stop);
}

control("left","left");
control("right","right");
control("nitro","nitro");

document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))
  e.preventDefault();
 if(e.key==="ArrowLeft")input.left=true;
 if(e.key==="ArrowRight")input.right=true;
 if(e.code==="Space")input.nitro=true;
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")input.left=false;
 if(e.key==="ArrowRight")input.right=false;
 if(e.code==="Space")input.nitro=false;
});
window.addEventListener("blur",()=>{
 input={left:false,right:false,nitro:false};
 if(state==="playing")$("pause").click();
});

menu("DROFIX RACING",
 "Choose your car and start racing!",
 "START RACE ▶");
draw();
</script>
</body>
 </html>
