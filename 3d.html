
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DROFIX RACING 3D</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;background:#080e19;
 color:white;font-family:Arial;
 touch-action:none;
}
#game{position:fixed;inset:0}
#hud{
 position:fixed;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-around;
 background:#071326cc;padding:12px;
 border-radius:12px;font-weight:bold;
 font-size:13px;
}
#hud b{color:#00e5ff}
#menu{
 position:fixed;inset:0;background:#071326dc;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;padding:20px;
}
h1{color:#00e5ff;font-size:30px}
button{
 border:0;border-radius:13px;padding:16px;
 background:#00dfff;color:#071326;
 font-weight:900;font-size:18px;
 touch-action:none;
}
#controls{
 position:fixed;bottom:20px;left:8px;right:8px;
 display:flex;justify-content:space-between;
 gap:7px;
}
#controls button{flex:1}
#nitro{background:#ffbf30}
#brake{background:#ff5365}
#message{line-height:1.7}
</style>
</head>
<body>

<div id="game"></div>

<div id="hud">
 <span>🏆 <b id="score">0</b></span>
 <span>LEVEL <b id="level">1</b></span>
 <span>🪙 <b id="coins">0</b></span>
 <span><b id="speed">0</b> KM/H</span>
</div>

<div id="menu">
 <h1 id="title">🏎️ DROFIX RACING 3D</h1>
 <p id="message">
 Real 3D Highway Racing<br>
 Avoid traffic and collect coins!
 </p>
 <button id="start">START RACE ▶</button>
</div>

<div id="controls">
 <button id="left">◀</button>
 <button id="brake">BRAKE</button>
 <button id="nitro">⚡</button>
 <button id="right">▶</button>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bc8ed);
scene.fog=new THREE.Fog(0x8bc8ed,35,125);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,200
);

const renderer=new THREE.WebGLRenderer({
 antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$("game").appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(
 0xffffff,0x426b38,2
));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-15,30,-20);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-40;
sun.shadow.camera.right=40;
sun.shadow.camera.top=40;
sun.shadow.camera.bottom=-40;
scene.add(sun);

function box(w,h,d,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color,roughness:.55,metalness:.15
  })
 );
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 return mesh;
}

// Ground
const ground=box(200,.1,250,0x268044);
ground.position.set(0,-.15,30);
scene.add(ground);

// Highway
const road=box(12,.12,250,0x30343d);
road.position.set(0,0,30);
scene.add(road);

// Road lines
let lines=[];
for(let z=-80;z<100;z+=12){
 for(let x of [-2,2]){
  let line=box(.13,.025,5,0xffffff);
  line.position.set(x,.09,z);
  scene.add(line);
  lines.push(line);
 }
}

// Road boundaries
for(let x of [-5.8,5.8]){
 let edge=box(.16,.08,250,0xffffff);
 edge.position.set(x,.1,30);
 scene.add(edge);
}

// 3D Trees
let trees=[];
function tree(x,z){
 const group=new THREE.Group();
 const trunk=box(.45,2,.45,0x71441f);
 trunk.position.y=1;
 group.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.6,4,7),
  new THREE.MeshStandardMaterial({color:0x086b30})
 );
 leaves.position.y=4;
 leaves.castShadow=true;
 group.add(leaves);

 group.position.set(x,0,z);
 scene.add(group);
 trees.push(group);
}

for(let z=-80;z<100;z+=10){
 tree(-9-Math.random()*4,z);
 tree(9+Math.random()*4,z+4);
}

// Sports car model
function makeCar(color){
 const car=new THREE.Group();

 const body=box(1.8,.55,3.5,color);
 body.position.y=.65;
 car.add(body);

 const hood=box(1.65,.12,1, color);
 hood.position.set(0,.99,-1);
 car.add(hood);

 const roof=box(1.4,.55,1.5,0x15263c);
 roof.position.set(0,1.15,.15);
 car.add(roof);

 const windshield=box(1.35,.08,.55,0x61caff);
 windshield.position.set(0,1.44,-.35);
 car.add(windshield);

 // Wheels
 for(let x of [-1,1]){
  for(let z of [-1.05,1.05]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.37,.37,.23,16),
    new THREE.MeshStandardMaterial({color:0x101014})
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.4,z);
   wheel.castShadow=true;
   car.add(wheel);
  }
 }

 // Rear lights
 for(let x of [-.6,.6]){
  const light=box(.38,.13,.07,0xff2020);
  light.position.set(x,.7,1.78);
  car.add(light);
 }

 // Headlights
 for(let x of [-.6,.6]){
  const light=box(.4,.13,.07,0xffffcc);
  light.position.set(x,.7,-1.78);
  car.add(light);
 }

 return car;
}

const player=makeCar(0x00dfff);
player.position.set(0,.1,5);
scene.add(player);

// Chase camera
camera.position.set(0,5,13);
camera.lookAt(0,1,-12);

// Game state
let running=false;
let score=0,level=1,coins=0;
let speed=0,spawn=0;
let enemies=[];
let pickups=[];
let last=0;
let keys={
 left:false,right:false,
 brake:false,nitro:false
};

function coin(x,z){
 const mesh=new THREE.Mesh(
  new THREE.TorusGeometry(.5,.16,8,16),
  new THREE.MeshStandardMaterial({
   color:0xffd700,
   metalness:.7,roughness:.2
  })
 );
 mesh.position.set(x,1,z);
 scene.add(mesh);
 pickups.push(mesh);
}

function traffic(){
 const lane=[-4,0,4][Math.floor(Math.random()*3)];

 if(Math.random()<.3){
  coin(lane,-75);
 }else{
  const colors=[0xff354f,0xffa52b,0x985bff];
  const car=makeCar(
   colors[Math.floor(Math.random()*colors.length)]
  );
  car.position.set(lane,.1,-75);
  car.rotation.y=Math.PI;
  scene.add(car);
  enemies.push(car);
 }
}

function hud(){
 $("score").textContent=Math.floor(score);
 $("level").textContent=level;
 $("coins").textContent=coins;
 $("speed").textContent=Math.floor(speed);
}

function gameOver(){
 running=false;
 $("menu").style.display="flex";
 $("title").textContent="💥 GAME OVER";
 $("message").textContent=
 "Score: "+Math.floor(score)+" | Coins: "+coins;
 $("start").textContent="RESTART RACE ▶";
}

function start(){
 enemies.forEach(o=>scene.remove(o));
 pickups.forEach(o=>scene.remove(o));
 enemies=[];pickups=[];

 score=0;level=1;coins=0;
 speed=100;spawn=0;
 player.position.x=0;
 keys={left:false,right:false,brake:false,nitro:false};
 last=0;
 running=true;
 $("menu").style.display="none";
 hud();
}

$("start").onclick=start;

function bind(id,key){
 const b=$(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 const stop=()=>keys[key]=false;
 b.addEventListener("pointerup",stop);
 b.addEventListener("pointercancel",stop);
 b.addEventListener("lostpointercapture",stop);
}

bind("left","left");
bind("right","right");
bind("brake","brake");
bind("nitro","nitro");

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.code==="Space")keys.brake=true;
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
 if(e.code==="Space")keys.brake=false;
});

window.addEventListener("blur",()=>{
 keys.left=false;keys.right=false;
 keys.brake=false;keys.nitro=false;
});

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(running){
  level=Math.min(10,1+Math.floor(score/150));

  const target=keys.brake?45:
   keys.nitro?230:120+level*8;

  speed+=(target-speed)*dt*3;
  const move=speed/20*dt;

  if(keys.left)player.position.x-=7*dt;
  if(keys.right)player.position.x+=7*dt;

  player.position.x=THREE.MathUtils.clamp(
   player.position.x,-4.7,4.7
  );

  player.rotation.z=THREE.MathUtils.lerp(
   player.rotation.z,
   keys.left?.07:keys.right?-.07:0,.12
  );

  // Follow the car
  camera.position.x=THREE.MathUtils.lerp(
   camera.position.x,player.position.x*.6,.05
  );
  camera.lookAt(player.position.x*.5,1,-12);

  lines.forEach(l=>{
   l.position.z+=move;
   if(l.position.z>22)l.position.z-=180;
  });

  trees.forEach(t=>{
   t.position.z+=move;
   if(t.position.z>25)t.position.z-=180;
  });

  spawn+=dt;
  if(spawn>Math.max(.6,1.7-level*.08)){
   spawn=0;
   traffic();
  }

  enemies.forEach(e=>e.position.z+=move*1.2);

  pickups.forEach(p=>{
   p.position.z+=move;
   p.rotation.y+=dt*3;
  });

  for(let i=enemies.length-1;i>=0;i--){
   const e=enemies[i];
   if(Math.abs(e.position.z-player.position.z)<2.7 &&
      Math.abs(e.position.x-player.position.x)<1.65){
    gameOver();
   }
   if(e.position.z>25){
    scene.remove(e);
    enemies.splice(i,1);
   }
  }

  for(let i=pickups.length-1;i>=0;i--){
   const p=pickups[i];
   if(Math.abs(p.position.z-player.position.z)<1.5 &&
      Math.abs(p.position.x-player.position.x)<1.3){
    coins++;
    scene.remove(p);
    pickups.splice(i,1);
   }else if(p.position.z>25){
    scene.remove(p);
    pickups.splice(i,1);
   }
  }

  score+=dt*speed/10;
  hud();
 }

 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
   </html>
